<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Silver Metallic Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background Badge -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Luxury Ring Accent -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Speedline Glow -->
  <path d="M 80 340 L 432 340" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>

  <!-- Luxury Sports Car Vector Silhouette -->
  <g transform="translate(46, 120)">
    <!-- Car Body -->
    <path d="M 40 185 
             C 50 170, 75 160, 110 160 
             C 140 160, 160 145, 200 100 
             C 230 65, 275 60, 320 65 
             C 355 70, 380 90, 395 130 
             C 410 155, 415 170, 418 185 
             C 422 195, 415 205, 400 205 
             L 360 205 
             C 355 175, 325 155, 295 155 
             C 265 155, 235 175, 230 205 
             L 160 205 
             C 155 175, 125 155, 95 155 
             C 65 155, 35 175, 30 205 
             L 15 205 
             C 5 205, 0 198, 5 190 
             Z" 
          fill="url(#silverGrad)"/>

    <!-- Windshield & Windows -->
    <path d="M 195 110 
             C 225 78, 260 75, 305 78 
             C 335 82, 355 98, 368 130 
             L 245 130 
             Z" 
          fill="#090d16" opacity="0.9"/>
    
    <path d="M 145 145 
             L 230 145 
             L 190 115 
             C 165 130, 150 140, 145 145 
             Z" 
          fill="#090d16" opacity="0.85"/>

    <!-- Headlight Beam Glow (Cyan/Gold) -->
    <polygon points="405,160 440,150 435,170" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Wheels (Front & Back) -->
    <!-- Front Wheel (Right) -->
    <g transform="translate(295, 205)">
      <circle cx="0" cy="0" r="34" fill="#090d16" stroke="url(#silverGrad)" stroke-width="6"/>
      <circle cx="0" cy="0" r="22" fill="#1e293b"/>
      <circle cx="0" cy="0" r="10" fill="url(#goldGrad)"/>
      <!-- Rim Spokes -->
      <line x1="-18" y1="0" x2="18" y2="0" stroke="url(#silverGrad)" stroke-width="2.5"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="url(#silverGrad)" stroke-width="2.5"/>
      <line x1="-13" y1="-13" x2="13" y2="13" stroke="url(#silverGrad)" stroke-width="2.5"/>
      <line x1="-13" y1="13" x2="13" y2="-13" stroke="url(#silverGrad)" stroke-width="2.5"/>
    </g>

    <!-- Rear Wheel (Left) -->
    <g transform="translate(95, 205)">
      <circle cx="0" cy="0" r="34" fill="#090d16" stroke="url(#silverGrad)" stroke-width="6"/>
      <circle cx="0" cy="0" r="22" fill="#1e293b"/>
      <circle cx="0" cy="0" r="10" fill="url(#goldGrad)"/>
      <!-- Rim Spokes -->
      <line x1="-18" y1="0" x2="18" y2="0" stroke="url(#silverGrad)" stroke-width="2.5"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="url(#silverGrad)" stroke-width="2.5"/>
      <line x1="-13" y1="-13" x2="13" y2="13" stroke="url(#silverGrad)" stroke-width="2.5"/>
      <line x1="-13" y1="13" x2="13" y2="-13" stroke="url(#silverGrad)" stroke-width="2.5"/>
    </g>

    <!-- Aerodynamic Gold Side Decal / Accent -->
    <path d="M 60 178 Q 180 185 385 168" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography: AL-FALAH -->
  <text x="256" y="420" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        font-family="'Times New Roman', Georgia, serif" 
        font-size="34" 
        font-weight="bold" 
        letter-spacing="5">
    AL-FALAH
  </text>
  <text x="256" y="450" 
        text-anchor="middle" 
        fill="#94a3b8" 
        font-family="'Times New Roman', Georgia, serif" 
        font-size="16" 
        font-weight="bold" 
        letter-spacing="6">
    RENT A CAR
  </text>
</svg>
