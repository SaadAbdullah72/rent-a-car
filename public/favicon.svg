<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Luxury Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Pure Platinum & Crisp White Gradient for Car Body -->
    <linearGradient id="whiteCarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Platinum Metallic Highlight -->
    <linearGradient id="platinumGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Luxury Gold Accent -->
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Dark Tinted Privacy Glass -->
    <linearGradient id="darkGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glow Effect for Headlights & Wheels -->
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Dark Rounded Icon Badge -->
  <rect width="512" height="512" rx="128" fill="url(#darkBg)" />
  
  <!-- Subtle Gold / Platinum Dual Border Rings -->
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#luxuryGold)" stroke-width="4" opacity="0.85" />
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4" />

  <!-- Speedline Glow on Ground -->
  <ellipse cx="256" cy="365" rx="195" ry="18" fill="#000000" opacity="0.8" filter="url(#carGlow)" />
  <line x1="60" y1="360" x2="452" y2="360" stroke="url(#luxuryGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- ==================================================== -->
  <!-- CRISP WHITE LUXURY AERODYNAMIC EXECUTIVE CAR -->
  <!-- ==================================================== -->
  <g transform="translate(36, 125)" filter="url(#softShadow)">
    
    <!-- Underbody Shadow -->
    <path d="M 30 225 L 410 225 L 420 232 L 20 232 Z" fill="#020617" opacity="0.9" />

    <!-- Main Crisp White Car Silhouette Body -->
    <path d="M 22 205 
             C 25 185, 45 170, 75 168 
             C 105 166, 125 152, 160 105 
             C 195 58, 255 52, 315 62 
             C 355 68, 385 92, 405 135 
             C 425 162, 435 178, 438 198 
             C 440 212, 430 222, 415 222 
             L 375 222 
             C 370 185, 335 160, 298 160 
             C 260 160, 228 185, 222 222 
             L 155 222 
             C 150 185, 115 160, 78 160 
             C 40 160, 8 185, 2 222 
             L -5 222 
             C -15 222, -20 215, -15 205 
             Z" 
          fill="url(#whiteCarGrad)" 
          stroke="url(#platinumGleam)" 
          stroke-width="3" />

    <!-- Sleek Aerodynamic Roof Reflection Line -->
    <path d="M 162 104 C 205 65, 260 58, 318 68 C 352 74, 380 95, 398 132" 
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Tinted Executive Dark Windows Glass -->
    <path d="M 172 108 
             C 200 72, 245 68, 305 72 
             C 335 76, 360 92, 375 125 
             L 242 125 
             Z" 
          fill="url(#darkGlass)" 
          stroke="#475569" 
          stroke-width="2" />
    
    <path d="M 125 142 
             L 228 142 
             L 178 108 
             C 148 125, 132 135, 125 142 
             Z" 
          fill="url(#darkGlass)" 
          stroke="#475569" 
          stroke-width="2" />

    <!-- Window Pillar Split (Chrome Trim) -->
    <line x1="235" y1="74" x2="235" y2="142" stroke="url(#luxuryGold)" stroke-width="3.5" />
    <path d="M 122 144 L 378 144" stroke="url(#luxuryGold)" stroke-width="2" />

    <!-- Crisp Character Shoulder Line -->
    <path d="M 28 180 Q 200 188 425 175" stroke="#94a3b8" stroke-width="2.5" fill="none" />

    <!-- Modern LED Headlight Beam (Bright Xenon White/Cyan) -->
    <polygon points="415,170 445,162 440,185" fill="#38bdf8" filter="url(#carGlow)" />
    <polygon points="418,172 442,166 438,182" fill="#ffffff" />

    <!-- Sleek Red Tail Light Bar -->
    <path d="M -12 195 L 8 190 L 5 204 L -14 204 Z" fill="#ef4444" filter="url(#carGlow)" />

    <!-- Front & Rear Wheels (Luxury Dual-Tone Alloys) -->
    <!-- Front Wheel (Right) -->
    <g transform="translate(298, 222)">
      <circle cx="0" cy="0" r="38" fill="#020617" stroke="#ffffff" stroke-width="6" />
      <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="url(#luxuryGold)" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="url(#luxuryGold)" />
      <!-- High-End 5-Spoke Rims -->
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffffff" stroke-width="3.5" />
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#ffffff" stroke-width="3.5" />
      <line x1="-16" y1="-16" x2="16" y2="16" stroke="#ffffff" stroke-width="3.5" />
      <line x1="-16" y1="16" x2="16" y2="-16" stroke="#ffffff" stroke-width="3.5" />
    </g>

    <!-- Rear Wheel (Left) -->
    <g transform="translate(78, 222)">
      <circle cx="0" cy="0" r="38" fill="#020617" stroke="#ffffff" stroke-width="6" />
      <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="url(#luxuryGold)" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="url(#luxuryGold)" />
      <!-- High-End 5-Spoke Rims -->
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffffff" stroke-width="3.5" />
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#ffffff" stroke-width="3.5" />
      <line x1="-16" y1="-16" x2="16" y2="16" stroke="#ffffff" stroke-width="3.5" />
      <line x1="-16" y1="16" x2="16" y2="-16" stroke="#ffffff" stroke-width="3.5" />
    </g>
  </g>

  <!-- ==================================================== -->
  <!-- GOLD EXECUTIVE BRANDING BADGE -->
  <!-- ==================================================== -->
  <g transform="translate(256, 425)">
    <!-- Gold Crown / Star Emblem -->
    <polygon points="0,-18 6,-4 20,-4 10,6 14,20 0,11 -14,20 -10,6 -20,-4 -6,-4" fill="url(#luxuryGold)" filter="url(#carGlow)" />
    
    <!-- Clean Crisp Title -->
    <text x="0" y="38" 
          text-anchor="middle" 
          fill="#ffffff" 
          font-family="'Times New Roman', Georgia, serif" 
          font-size="24" 
          font-weight="bold" 
          letter-spacing="6">
      AL-FALAH
    </text>
  </g>
</svg>