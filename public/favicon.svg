<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Ultra Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Supercar Crimson / Sunset Gradient for Body -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Windshield Tint Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95" />
    </linearGradient>

    <!-- Headlight Cyan Neon Glow -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Main Outer Badge Frame (Rounded Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#shieldBg)" filter="url(#badgeShadow)" />
  
  <!-- Outer Gold Border -->
  <rect x="22" y="22" width="468" height="468" rx="114" fill="none" stroke="url(#goldMetallic)" stroke-width="8" opacity="0.9" />
  
  <!-- Inner Subtle Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Background Lighting Rays / Speedlines -->
  <path d="M 60 420 L 256 220 L 452 420" stroke="url(#goldMetallic)" stroke-width="3" stroke-opacity="0.25" fill="none" />
  <circle cx="256" cy="220" r="160" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- ==================================================== -->
  <!-- FRONT-FACING AGGRESSIVE LUXURY HYPERCAR (HIGH CLARITY) -->
  <!-- ==================================================== -->
  <g transform="translate(0, 10)">
    <!-- Car Ground Shadow -->
    <ellipse cx="256" cy="385" rx="180" ry="24" fill="#000000" opacity="0.75" filter="url(#neonGlow)" />

    <!-- Roof & Cabin Pillars -->
    <path d="M 168 185 
             C 178 135, 205 110, 256 110 
             C 307 110, 334 135, 344 185 
             Z" 
          fill="#0f172a" stroke="url(#goldMetallic)" stroke-width="4" />

    <!-- Windshield (Glossy Cyan Glass) -->
    <path d="M 175 182 
             C 185 140, 210 120, 256 120 
             C 302 120, 327 140, 337 182 
             Z" 
          fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Windshield Center Reflection Line -->
    <path d="M 256 120 L 256 182" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
    <path d="M 215 135 C 235 130, 245 155, 240 180" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" fill="none" />

    <!-- Side Mirrors -->
    <!-- Left Mirror -->
    <path d="M 152 175 C 130 170, 120 182, 142 192 L 168 190 Z" fill="url(#carBodyGrad)" stroke="url(#goldMetallic)" stroke-width="2" />
    <!-- Right Mirror -->
    <path d="M 360 175 C 382 170, 392 182, 370 192 L 344 190 Z" fill="url(#carBodyGrad)" stroke="url(#goldMetallic)" stroke-width="2" />

    <!-- Main Aerodynamic Hood & Fenders (Aggressive Muscular Stance) -->
    <path d="M 160 185 
             C 120 195, 80 230, 72 285 
             C 68 315, 85 330, 110 332 
             L 130 334 
             L 145 355 
             C 170 365, 342 365, 367 355 
             L 382 334 
             L 402 332 
             C 427 330, 444 315, 440 285 
             C 432 230, 392 195, 352 185 
             C 310 180, 202 180, 160 185 
             Z" 
          fill="url(#carBodyGrad)" 
          stroke="url(#goldMetallic)" 
          stroke-width="5" />

    <!-- Hood Sculpted Power Bulge & Creases -->
    <path d="M 185 186 L 205 275 L 256 285 L 307 275 L 327 186" fill="#7f1d1d" opacity="0.6" />
    <path d="M 205 275 L 256 285 L 307 275" stroke="url(#goldMetallic)" stroke-width="3" fill="none" />
    <line x1="256" y1="184" x2="256" y2="283" stroke="url(#goldMetallic)" stroke-width="2" stroke-opacity="0.8" />

    <!-- Front Grille (Honeycomb Dark Carbon Center) -->
    <path d="M 170 300 
             L 342 300 
             L 332 348 
             C 290 358, 222 358, 180 348 
             Z" 
          fill="#090d16" 
          stroke="url(#goldMetallic)" 
          stroke-width="3" />

    <!-- Grille Mesh Accents -->
    <line x1="210" y1="305" x2="200" y2="345" stroke="#334155" stroke-width="2" />
    <line x1="256" y1="302" x2="256" y2="352" stroke="url(#goldMetallic)" stroke-width="2.5" />
    <line x1="302" y1="305" x2="312" y2="345" stroke="#334155" stroke-width="2" />

    <!-- Front Splitter / Lower Lip (High Performance Gold) -->
    <path d="M 115 348 L 140 372 L 372 372 L 397 348 L 370 358 L 142 358 Z" fill="url(#goldMetallic)" />

    <!-- Left Angular LED Headlight (Glowing Cyan & Diamond Bright) -->
    <g filter="url(#neonGlow)">
      <!-- Left Light Shape -->
      <polygon points="105,270 178,260 170,285 118,288" fill="#020617" stroke="url(#goldMetallic)" stroke-width="2" />
      <polygon points="112,272 172,264 165,280 122,283" fill="url(#neonCyan)" />
      <!-- DRL Brow Line -->
      <path d="M 98 266 Q 140 256 182 258" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Right Angular LED Headlight (Glowing Cyan & Diamond Bright) -->
    <g filter="url(#neonGlow)">
      <!-- Right Light Shape -->
      <polygon points="407,270 334,260 342,285 394,288" fill="#020617" stroke="url(#goldMetallic)" stroke-width="2" />
      <polygon points="400,272 340,264 347,280 390,283" fill="url(#neonCyan)" />
      <!-- DRL Brow Line -->
      <path d="M 414 266 Q 372 256 330 258" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Front Logo Crest (Gold Crown/Diamond) -->
    <polygon points="256,238 266,252 256,262 246,252" fill="url(#goldMetallic)" filter="url(#neonGlow)" />
  </g>

  <!-- ==================================================== -->
  <!-- BOLD EXECUTIVE TYPOGRAPHY (STANDOUT READABILITY) -->
  <!-- ==================================================== -->
  <g transform="translate(0, 440)">
    <!-- Gold Ribbon Bar -->
    <rect x="96" y="-18" width="320" height="42" rx="21" fill="#020617" stroke="url(#goldMetallic)" stroke-width="3" />
    
    <!-- Text: AL-FALAH -->
    <text x="256" y="10" 
          text-anchor="middle" 
          fill="url(#goldMetallic)" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="22" 
          font-weight="900" 
          letter-spacing="5">
      AL-FALAH
    </text>
  </g>
</svg>